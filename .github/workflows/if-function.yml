
name: if-function

on:
  push:
    branches:
      - main
      - feature/**
      - developer

jobs:
  quality-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'feature') && github.event_name == 'push'
    steps:
      - name: Quality Check
        run: echo "performing quality check on code"

  dev-deploy:
    runs-on: ubuntu-latest
    if: github.ref_name == 'developer' && github.event_name == 'push'
    steps:
      - name: Deploy to Dev
        run: echo "deploying code to dev environment"

  main-deploy:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && github.event_name == 'push'
    steps:
      - name: Deploy to Main
        run: echo "deploying code to main environment"

  
  success_notification:
    needs: ['quality-check', 'dev-deploy', 'main-deploy']
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Success
        run: echo "Success mail sent to team"

  failure_notification:
    needs: ['quality-check', 'dev-deploy', 'main-deploy']
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Failure
        run: echo "Failure mail sent to team"
