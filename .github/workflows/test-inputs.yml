name: test-inputs
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "select environment"
        required: true
        default: dev
        type: choice 
        options:
          - dev
          - test
          - uat
          - prod
        artifact_tag:
          description: select git tag to deploy
          required: true
jobs:
  test-input:
    runs-on: ubuntu-24.04
    steps:
      - name: deploy the application
        run: echo "deploying app into ${{ inputs.artifact_tag}} app into {{ inputs.environment}}
